name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18

      - run: npm install
      - run: npm run typecheck
      - run: npm test

      - name: Check tag matches package versions
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          for p in packages/cli packages/extension; do
            V=$(node -p "require('./$p/package.json').version")
            [ "$V" = "$TAG" ] || { echo "$p is $V, tag is $TAG"; exit 1; }
          done

      - name: Build CLI tarball
        run: |
          npm run build -w packages/cli
          cd packages/cli && npm pack

      - name: Package VS Code extension
        run: npm run package -w packages/extension

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            packages/cli/*.tgz \
            packages/extension/*.vsix