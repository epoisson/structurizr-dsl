name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # required to create the GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.18

      - name: Install dependencies
        run: npm install

      - name: Check tag matches package versions
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          for p in packages/cli packages/extension; do
            V=$(node -p "require('./$p/package.json').version")
            [ "$V" = "$TAG" ] || { echo "$p is $V, tag is $TAG"; exit 1; }
          done

      - name: Build CLI (tgz and zip)
        run: |
          npm run build -w packages/cli
          cd packages/cli
          npm pack
          zip -r "../../structurizr-dsl-cli-${GITHUB_REF_NAME#v}.zip" dist

      - name: Package VS Code extension
        run: |
          npm run build -w packages/extension
          npm run package -w packages/extension

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packages/cli/*.tgz
            packages/extension/*.vsix
            structurizr-dsl-cli-*.zip
          generate_release_notes: true